name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          cache-size-limit: 64
          cache-key: fmt-check
      - name: Confirm Zig version
        run: bash scripts/check-zig-version.sh
      - name: Check formatting
        run: zig fmt --check src tests build.zig

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          cache-size-limit: 512
          cache-key: ${{ matrix.os }}
      - name: Confirm Zig version
        run: bash scripts/check-zig-version.sh
      - name: Run tests
        run: zig build test --summary all

  size-gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          cache-size-limit: 512
          cache-key: size-gate
      - name: Build release
        run: zig build release
      - name: Enforce release size cap
        run: |
          set -euo pipefail
          size=$(wc -c < zig-out/release/smll)
          limit=358400 # 350 KiB
          echo "binary size: ${size} bytes (cap ${limit})"
          if [ "$size" -ge "$limit" ]; then
            echo "::error::binary size ${size} exceeds release cap ${limit}"
            exit 1
          fi
      - name: Upload release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smll-linux
          path: zig-out/release/smll
          retention-days: 14

  # Non-blocking pipe-throughput smoke alarm. continue-on-error keeps it off the
  # merge gate: a floor trip surfaces a ::error:: annotation for a human to look
  # at, but never blocks a PR. Catches egregious scan regressions (e.g. O(n^2)),
  # not microbenchmark noise.
  pipe-bench:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          cache-size-limit: 512
          cache-key: pipe-bench
      - name: Confirm Zig version
        run: bash scripts/check-zig-version.sh
      - name: Benchmark pipe throughput
        run: RUNS=25 WARMUP=5 bash scripts/bench-pipe.sh
